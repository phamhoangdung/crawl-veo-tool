# Build the Windows installer (VieDub Studio) and publish it as a GitHub Release on EVERY push to main.
# The version is automatic: the next patch after the highest existing `v*` tag (or the version in
# src-tauri/tauri.conf.json when that is higher, e.g. after `npm run version:bump minor`). The tag
# is created by the release itself; the repo files are not modified. Docs-only pushes are skipped.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute the next version
        id: v
        run: |
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | grep -oE '[0-9]+[.][0-9]+[.][0-9]+')
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="$conf"
          else
            top=$( (echo "$conf"; echo "$latest") | sort -V | tail -n1)
            if [ "$top" = "$conf" ] && [ "$conf" != "$latest" ]; then
              next="$conf"
            else
              next=$(echo "$latest" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
            fi
          fi
          echo "Next version: $next (config $conf, latest tag ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root + frontend dependencies
        run: |
          npm ci
          pnpm -C frontend install --frozen-lockfile

      - name: Create the backend venv (the build script uses backend/.venv)
        run: |
          python -m venv backend/.venv
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          # AI libs (torch, ...) are NOT bundled: they ship as the downloadable AI pack.
          Get-Content backend/requirements.txt | Where-Object { $_ -notmatch "^(faster-whisper|demucs|speechbrain|scikit-learn)" } | Set-Content req-core.txt
          backend\.venv\Scripts\python.exe -m pip install -r req-core.txt

      - name: Apply the computed version to the build files
        run: node scripts/bump-version.mjs ${{ needs.plan.outputs.version }}

      # Not `npm run desktop:build`: the version was already set above.
      - name: Build installer
        run: npm run desktop:build:keep

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viedub-installers
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release (tag v${{ needs.plan.outputs.version }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
