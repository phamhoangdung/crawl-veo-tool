# Build installer Windows (VieDub Studio) và đính vào GitHub Release.
# Kích hoạt: đẩy tag dạng v0.1.10 (phải khớp version trong src-tauri/tauri.conf.json),
# hoặc chạy tay ở tab Actions (chỉ build, upload artifact, không tạo Release).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra tag khớp version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ "v$conf" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} không khớp tauri.conf.json (v$conf)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài dependency root + frontend
        run: |
          npm ci
          pnpm -C frontend install --frozen-lockfile

      - name: Tạo venv backend (script build dùng backend/.venv)
        run: |
          python -m venv backend/.venv
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          # AI libs (torch, ...) are NOT bundled: they ship as the downloadable AI pack.
          Get-Content backend/requirements.txt | Where-Object { $_ -notmatch "^(faster-whisper|demucs|speechbrain|scikit-learn)" } | Set-Content req-core.txt
          backend\.venv\Scripts\python.exe -m pip install -r req-core.txt

      # Không dùng `npm run desktop:build` vì nó tự bump version — version đã do tag quyết định.
      - name: Build installer
        run: npm run desktop:build:keep

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viedub-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Tạo GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
