# Build the Windows installer (VieDub Studio) and publish it as a GitHub Release.
# The tag is derived automatically from the version in src-tauri/tauri.conf.json (v<version>):
# every push to main checks whether that release already exists and only builds when it does not.
# To ship a new release, bump the version (`npm run version:bump`), commit and push; no manual tag.
# Manual runs from the Actions tab behave the same way (use them to retry a failed build).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check for an existing release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root + frontend dependencies
        run: |
          npm ci
          pnpm -C frontend install --frozen-lockfile

      - name: Create the backend venv (the build script uses backend/.venv)
        run: |
          python -m venv backend/.venv
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          # AI libs (torch, ...) are NOT bundled: they ship as the downloadable AI pack.
          Get-Content backend/requirements.txt | Where-Object { $_ -notmatch "^(faster-whisper|demucs|speechbrain|scikit-learn)" } | Set-Content req-core.txt
          backend\.venv\Scripts\python.exe -m pip install -r req-core.txt

      # Not `npm run desktop:build`: that bumps the version, which here is decided by the commit.
      - name: Build installer
        run: npm run desktop:build:keep

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viedub-installers
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release (tag v${{ needs.plan.outputs.version }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
